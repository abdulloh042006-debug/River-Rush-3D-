name: Source and Procedural World Tests (No Unity License)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Static source and integration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Unity source structure
        run: python tools/source_audit.py
      - name: .NET SDK for deterministic procedural river tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and stress-test real river branch C# mathematics
        run: dotnet run --project tools/branch-smoke/BranchSmoke.csproj --configuration Release
